services:
  - type: web
    name: personal-finance-manager
    env: docker
    plan: free
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: finance-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finance-db
          property: password

databases:
  - name: finance-db
    databaseName: financedb
    user: financeuser
    plan: free
